[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmlab"
version = "0.42.4"
description = "Run Swarm Lab agents, teams and workflows from Python: on a Swarm Lab server or on this machine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "LicenseRef-SwarmLab-Source-Available (Copyright (c) 2026 Joe El Khoury)" }
authors = [{ name = "Joe El Khoury" }]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "License :: Other/Proprietary License", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/joeaelkhoury/SwarmLab"

[project.scripts]
swarmlab = "swarmlab.cli:main"

[tool.setuptools]
packages = ["swarmlab"]
py-modules = ["swarmlab_client"]
